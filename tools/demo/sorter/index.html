<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>jevalaya sorter — live routing demo</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: #0d1117; color: #f0f6fc; }
  body { min-height: 100svh; display: grid; place-items: center; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  #wrap { width: min(1280px, 100vw, calc(100svh * 16 / 9)); }
  canvas { display: block; width: 100%; height: auto; aspect-ratio: 16 / 9; background: #0d1117; }
  #hint { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<main id="wrap"><canvas id="game" width="1280" height="720" role="img" aria-label="jevalaya sorter — live routing demo. News articles are classified into World, Sports, Business, and Sci/Tech, with a live backend receipt." aria-describedby="hint">Live routing demo. Use a browser with Canvas support.</canvas></main>
<div id="hint">Space pauses the falling cards. L toggles a simulated 500 ms action delay; displayed inference latency is unchanged. G arms one golden item with a scripted Jev call. R restarts.</div>
<script src="config.js"></script>
<script src="sorter.js"></script>
</body>
</html>
