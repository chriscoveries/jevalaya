# jevalaya example config — copy to jevalaya.toml and point at your models.
# Secrets are env-only: the token and API key names are configured here,
# their values never are.

[server]
listen = "127.0.0.1:8767"
auth_token_env = "JEVALAYA_TOKEN"
max_body_bytes = 262144
max_inflight = 4
request_timeout_ms = 30000
offline = false

[policy]
default_checkpoint = "english"
auto_task_detection = false
compare_backends = ["mlx", "jev"]

# Model directories — `hf download` puts them in the HF hub cache:
#   hf download aac6fef/laya-mlx
#   hf download aac6fef/laya-multilingual-mlx
#   hf download aac6fef/laya-typed-decisions-mlx
#   hf download aac6fef/laya-multilingual-coreml-ane
# then point each key at the snapshot dir (…/models--aac6fef--REPO/snapshots/HASH)
# or any local dir with the same contents. Paths must be absolute — ~ is
# not expanded.
[models]
english = "/Users/YOU/.cache/huggingface/hub/models--aac6fef--laya-mlx/snapshots/HASH"
multilingual = "/Users/YOU/.cache/huggingface/hub/models--aac6fef--laya-multilingual-mlx/snapshots/HASH"
typed_decisions = "/Users/YOU/.cache/huggingface/hub/models--aac6fef--laya-typed-decisions-mlx/snapshots/HASH"

[ane]
enabled = true
model = "/Users/YOU/.cache/huggingface/hub/models--aac6fef--laya-multilingual-coreml-ane/snapshots/HASH"
max_tokens = 96
alignment = 1
preload = false

[mlx]
enabled = true
# sys.path entries for the embedded interpreter: the dir containing laya_mlx/
# (a laya-mlx checkout, or site-packages if pip-installed) and your venv's
# site-packages. PYO3_PYTHON must point at that interpreter at BUILD time.
python_path = [
    "/path/to/laya-mlx",
    "/path/to/laya-mlx/.venv/lib/python3.13/site-packages",
]
max_loaded = 1
preload = false
# Optional socket sidecar fallback, never the v1 primary path.
sidecar_fallback = false
sidecar_socket = "/tmp/jevalaya-mlx.sock"

[jev]
enabled = true
base_url = "https://api.typesafe.ai"
predict_path = "/v1/systemone"
api_key_env = "TYPESAFE_API_KEY"
model = "jev-latest"
request_timeout_ms = 25000
retries = 2
confidence_threshold = 0.75
margin_threshold = 0.20
target_confidence_threshold = 0.85

[observability]
sink = "jsonl:/var/tmp/jevalaya-events.jsonl"
queue_capacity = 1024

[feedback]
sink = "jsonl:~/.jevalaya/feedback.jsonl"
