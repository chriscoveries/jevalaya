<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" role="img" aria-labelledby="title desc">
  <title id="title">Local confidence and remote escalation</title>
  <desc id="desc">A confident decision completes with a local ANE or MLX answer. A close call continues to the remote Jev service.</desc>

  <defs>
    <marker id="arrow-gray" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1L7 4L1 7" fill="none" stroke="#8b949e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1L7 4L1 7" fill="none" stroke="#3fb950" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1L7 4L1 7" fill="none" stroke="#d29922" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .sans { font-family: -apple-system, 'Helvetica Neue', sans-serif; }
      .mono { font-family: ui-monospace, 'SF Mono', Menlo, monospace; }
      .primary { fill: #f0f6fc; }
      .muted { fill: #8b949e; }
      .blue { fill: #58a6ff; }
      .teal { fill: #3fb950; }
      .amber { fill: #d29922; }
    </style>
  </defs>

  <rect width="800" height="320" fill="#0d1117"/>

  <!-- Confident, local completion -->
  <rect x="24" y="24" width="360" height="238" rx="8" fill="#161b22" stroke="#8b949e" stroke-width="1.5"/>
  <text x="48" y="59" class="sans primary" font-size="20" font-weight="600">confident</text>
  <text x="360" y="57" text-anchor="end" class="mono teal" font-size="11">LOCAL</text>

  <rect x="48" y="78" width="92" height="34" rx="8" fill="#0d1117" stroke="#8b949e" stroke-width="1.5"/>
  <text x="94" y="99" text-anchor="middle" class="mono primary" font-size="12">question</text>
  <path d="M140 95H161" fill="none" stroke="#3fb950" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow-teal)"/>

  <rect x="168" y="70" width="168" height="58" rx="8" fill="#0d1117" stroke="#3fb950" stroke-width="1.5"/>
  <text x="184" y="93" class="sans primary" font-size="13" font-weight="600">answer</text>
  <rect x="184" y="101" width="47" height="18" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="1.25"/>
  <text x="207.5" y="114" text-anchor="middle" class="mono blue" font-size="9.5">ANE</text>
  <rect x="237" y="101" width="47" height="18" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="1.25"/>
  <text x="260.5" y="114" text-anchor="middle" class="mono blue" font-size="9.5">MLX</text>
  <path d="M304 91L310 97L320 84" fill="none" stroke="#3fb950" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <text x="48" y="154" class="mono muted" font-size="11">confidence / margin</text>
  <text x="336" y="154" text-anchor="end" class="mono teal" font-size="11">high</text>
  <rect x="48" y="164" width="288" height="12" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
  <rect x="48" y="164" width="245" height="12" rx="6" fill="#3fb950"/>

  <path d="M48 211H77" fill="none" stroke="#3fb950" stroke-width="1.75" stroke-linecap="round"/>
  <circle cx="82" cy="211" r="4" fill="#3fb950"/>
  <text x="96" y="215" class="sans teal" font-size="13">answer stops locally</text>
  <text x="48" y="239" class="mono muted" font-size="10.5">ANE or MLX · no network hop</text>

  <!-- Close call, remote escalation -->
  <rect x="416" y="24" width="360" height="238" rx="8" fill="#161b22" stroke="#8b949e" stroke-width="1.5"/>
  <text x="440" y="59" class="sans primary" font-size="20" font-weight="600">close call</text>
  <text x="752" y="57" text-anchor="end" class="mono amber" font-size="11">ESCALATE</text>

  <rect x="440" y="78" width="92" height="34" rx="8" fill="#0d1117" stroke="#8b949e" stroke-width="1.5"/>
  <text x="486" y="99" text-anchor="middle" class="mono primary" font-size="12">question</text>
  <path d="M532 95H564" fill="none" stroke="#8b949e" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow-gray)"/>
  <circle cx="576" cy="95" r="8" fill="#0d1117" stroke="#d29922" stroke-width="1.5"/>
  <path d="M584 95H641" fill="none" stroke="#d29922" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow-amber)"/>

  <path d="M657 117H721C730 117 737 111 737 102C737 94 731 88 723 87C720 77 711 71 700 71C689 71 680 77 676 86C674 85 671 85 668 85C658 85 650 92 650 101C650 109 653 114 657 117Z"
        fill="#0d1117" stroke="#d29922" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="695" y="104" text-anchor="middle" class="mono amber" font-size="13" font-weight="600">Jev</text>

  <text x="440" y="154" class="mono muted" font-size="11">confidence / margin</text>
  <text x="728" y="154" text-anchor="end" class="mono amber" font-size="11">low</text>
  <rect x="440" y="164" width="288" height="12" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
  <rect x="440" y="164" width="86" height="12" rx="6" fill="#d29922"/>

  <path d="M440 211H552" fill="none" stroke="#d29922" stroke-width="1.75" stroke-linecap="round" stroke-dasharray="3 6" marker-end="url(#arrow-amber)"/>
  <text x="566" y="215" class="sans amber" font-size="13">continue to Jev</text>
  <text x="440" y="239" class="mono muted" font-size="10.5">low margin · explicit escalation</text>

  <text x="400" y="304" text-anchor="middle" class="sans primary" font-size="15" font-weight="500">local when it's sure — Jev when it isn't</text>
</svg>
