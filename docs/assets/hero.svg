<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">How jevalaya routes predictions</title>
  <desc id="desc">An application sends typed questions to one jevalaya endpoint. Jevalaya routes them to ANE, MLX, or the remote Jev API, then returns a detailed routing receipt.</desc>

  <defs>
    <marker id="arrow-gray" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1L7 4L1 7" fill="none" stroke="#8b949e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1L7 4L1 7" fill="none" stroke="#58a6ff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1L7 4L1 7" fill="none" stroke="#d29922" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .sans { font-family: -apple-system, 'Helvetica Neue', sans-serif; }
      .mono { font-family: ui-monospace, 'SF Mono', Menlo, monospace; }
      .primary { fill: #f0f6fc; }
      .muted { fill: #8b949e; }
      .blue { fill: #58a6ff; }
      .amber { fill: #d29922; }
    </style>
  </defs>

  <rect width="1200" height="420" fill="#0d1117"/>

  <!-- Calling application -->
  <rect x="50" y="155" width="174" height="90" rx="8" fill="#161b22" stroke="#8b949e" stroke-width="1.5"/>
  <text x="137" y="196" text-anchor="middle" class="sans primary" font-size="20" font-weight="600">your app</text>
  <text x="137" y="219" text-anchor="middle" class="mono muted" font-size="11">choice · score · noul</text>

  <!-- One request -->
  <path d="M224 200H354" fill="none" stroke="#8b949e" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow-gray)"/>
  <text x="289" y="179" text-anchor="middle" class="mono primary" font-size="13">POST /predict</text>

  <!-- Router -->
  <rect x="360" y="126" width="340" height="148" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <g fill="none" stroke="#58a6ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M397 173H414"/>
    <path d="M414 173C425 173 428 160 443 160"/>
    <path d="M414 173C426 173 432 173 443 173"/>
    <path d="M414 173C425 173 428 186 443 186"/>
  </g>
  <text x="464" y="181" class="mono primary" font-size="28" font-weight="600" letter-spacing="-1">jevalaya</text>
  <path d="M391 202H669" fill="none" stroke="#30363d" stroke-width="1.5"/>
  <text x="530" y="229" text-anchor="middle" class="mono muted" font-size="11.5">one endpoint · three backends · honest receipts</text>
  <text x="530" y="252" text-anchor="middle" class="sans blue" font-size="12">local decision router for Mac</text>

  <!-- Backend lanes -->
  <path d="M700 200C778 200 803 84 908 84" fill="none" stroke="#58a6ff" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow-blue)"/>
  <path d="M700 200H908" fill="none" stroke="#58a6ff" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow-blue)"/>
  <path d="M700 200C778 200 803 318 908 318" fill="none" stroke="#d29922" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow-amber)"/>

  <!-- ANE -->
  <rect x="914" y="42" width="246" height="84" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="934" y="75" class="sans primary" font-size="17" font-weight="600">ANE · Neural Engine</text>
  <rect x="934" y="88" width="88" height="24" rx="8" fill="#0d1117" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="978" y="105" text-anchor="middle" class="mono blue" font-size="12.5">~8 ms*</text>

  <!-- MLX -->
  <rect x="914" y="159" width="246" height="82" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="934" y="192" class="sans primary" font-size="17" font-weight="600">MLX · local</text>
  <rect x="934" y="204" width="65" height="23" rx="8" fill="#0d1117" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="966.5" y="220" text-anchor="middle" class="mono blue" font-size="12">local</text>

  <!-- Jev -->
  <rect x="914" y="276" width="246" height="84" rx="8" fill="#161b22" stroke="#d29922" stroke-width="1.5"/>
  <path d="M937 310H961C968 310 973 306 973 300C973 294 968 290 962 290C960 283 955 279 948 279C941 279 936 283 934 289C933 289 932 289 931 289C925 289 921 293 921 299C921 305 928 310 937 310Z"
        fill="none" stroke="#d29922" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="980" y="304" class="sans primary" font-size="17" font-weight="600">Jev · TypeSafe API</text>
  <rect x="980" y="316" width="105" height="25" rx="8" fill="#0d1117" stroke="#d29922" stroke-width="1.5"/>
  <text x="1032.5" y="333" text-anchor="middle" class="mono amber" font-size="12">network · $</text>
  <circle cx="1133" cy="328" r="11" fill="#0d1117" stroke="#d29922" stroke-width="1.5"/>
  <text x="1133" y="333" text-anchor="middle" class="mono amber" font-size="13" font-weight="600">$</text>

  <!-- Receipt returns to the caller -->
  <path d="M1140 386H73" fill="none" stroke="#8b949e" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="3 7" marker-end="url(#arrow-gray)"/>
  <text x="606" y="373" text-anchor="middle" class="mono muted" font-size="12.5">routing receipt — backend, confidence, margin, latency, reason</text>

  <text x="1150" y="409" text-anchor="end" class="sans muted" font-size="10.5">* upstream laya-coreml measurement, M3 Max</text>
</svg>
