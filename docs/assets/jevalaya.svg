<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <title>jevalaya — "Jev at home": a local-first decision router for your Mac</title>
  <desc>A dark GitHub-style social card showing one /predict endpoint forking into three lanes: ANE, MLX, and the Jev cloud API.</desc>
  <rect width="1600" height="900" fill="#0d1117"/>
  <rect x="56" y="56" width="1488" height="788" rx="28" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <path d="M56 156H1544" stroke="#30363d" stroke-width="2"/>
  <circle cx="102" cy="106" r="8" fill="#ff7b72"/>
  <circle cx="130" cy="106" r="8" fill="#d29922"/>
  <circle cx="158" cy="106" r="8" fill="#3fb950"/>
  <text x="205" y="115" fill="#8b949e" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" letter-spacing="2">CHRIS COVERIES / LOCAL-FIRST ML</text>
  <g font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="126" y="310" fill="#8b949e" font-size="22" letter-spacing="4">"BUT WE HAVE JEV AT HOME."</text>
    <text x="120" y="416" fill="#f0f6fc" font-size="88" font-weight="700" letter-spacing="-3">jevalaya</text>
    <text x="124" y="482" fill="#8b949e" font-size="21">typed answers on the Neural Engine — Jev when it earns it</text>
    <rect x="124" y="554" width="214" height="5" rx="3" fill="#3fb950"/>
    <text x="124" y="620" fill="#8b949e" font-size="21" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">noul · choice · score</text>
  </g>

  <g transform="translate(820 202)">
    <rect x="0" y="0" width="624" height="506" rx="24" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
    <!-- incoming /predict -->
    <rect x="28" y="216" width="128" height="74" rx="14" fill="#161b22" stroke="#8b949e" stroke-width="2"/>
    <text x="92" y="249" text-anchor="middle" fill="#f0f6fc" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="16" font-weight="700">POST</text>
    <text x="92" y="272" text-anchor="middle" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="14">/predict</text>
    <!-- fork curves -->
    <g fill="none" stroke-width="4" stroke-linecap="round">
      <path d="M156 253C216 253 216 101 286 101" stroke="#3fb950"/>
      <path d="M156 253H286" stroke="#58a6ff"/>
      <path d="M156 253C216 253 216 405 286 405" stroke="#d29922"/>
    </g>
    <!-- ANE lane -->
    <g>
      <rect x="286" y="60" width="310" height="82" rx="14" fill="#161b22" stroke="#3fb950" stroke-width="3"/>
      <text x="308" y="95" fill="#f0f6fc" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" font-weight="700">ANE</text>
      <text x="308" y="122" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="14">Neural Engine</text>
      <text x="574" y="108" text-anchor="end" fill="#3fb950" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="20" font-weight="700">~9ms</text>
    </g>
    <!-- MLX lane -->
    <g>
      <rect x="286" y="212" width="310" height="82" rx="14" fill="#161b22" stroke="#58a6ff" stroke-width="3"/>
      <text x="308" y="247" fill="#f0f6fc" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" font-weight="700">MLX</text>
      <text x="308" y="274" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="14">your GPU, still local</text>
      <text x="574" y="260" text-anchor="end" fill="#58a6ff" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="20" font-weight="700">~10ms</text>
    </g>
    <!-- API lane -->
    <g>
      <rect x="286" y="364" width="310" height="82" rx="14" fill="#161b22" stroke="#d29922" stroke-width="3"/>
      <text x="308" y="399" fill="#f0f6fc" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" font-weight="700">JEV API</text>
      <text x="308" y="426" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="14">the 1-in-50 call</text>
      <text x="574" y="412" text-anchor="end" fill="#d29922" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="20" font-weight="700">~300ms</text>
    </g>
    <text x="312" y="486" text-anchor="middle" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="18">CHEAPEST LANE THAT CAN ANSWER</text>
  </g>
  <text x="120" y="790" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="18" letter-spacing="1">JEVALAYA / JEV-LIKE DECISIONS, ON YOUR MAC</text>
</svg>
