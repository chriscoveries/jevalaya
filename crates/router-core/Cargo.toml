[package]
name = "jevalaya-router-core"
version = "0.1.0"
edition = "2021"
description = "jevalaya routing core: wire schema, checkpoint router, ordered decision table, backend dispatch/escalation/compare, observability events. Policy only — no HTTP client, embedded Python, or CoreML symbols."
license = "Apache-2.0"

[dependencies]
async-trait = "0.1"
futures = "0.3"
jevalaya-render = { path = "../render" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
tokio = { version = "1", features = ["rt", "sync", "macros"] }
unicode-general-category = "1"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
