[package]
name = "jevalaya-backend-jev"
version = "0.1.0"
edition = "2021"
description = "Jev TypeSafe HTTP backend (T005). Pooled reqwest client speaking the shared laya predict schema over POST <base_url>/v1/systemone; key from env only. Mirrors jev-ultrafast post_json retry + validate_choice invariants."
license = "Apache-2.0"

[dependencies]
async-trait = "0.1"
jevalaya-router-core = { path = "../router-core" }
serde_json = { version = "1", features = ["preserve_order"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["json", "rustls", "http2"] }
thiserror = "2"
tokio = { version = "=1.53.1", features = ["time", "macros", "rt-multi-thread"] }
