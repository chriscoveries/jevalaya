[package]
name = "jevalaya-render"
version = "0.1.0"
edition = "2021"
description = "Canonical Laya prompt rendering + token counting (T003). Rust port of laya-mlx common.py / prepared.py / tokenizer.py prompt path."
license = "Apache-2.0"

[dependencies]
tokenizers = "=0.23.2"
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"

[dev-dependencies]
glob = "0.3"
